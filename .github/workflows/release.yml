name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  TARGET: x86_64-unknown-linux-musl

jobs:
  required:
    uses: ./.github/workflows/required.yml

  package-linux:
    needs: required
    name: Build and verify WSL release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install pinned Rust toolchain and target
        run: rustup show active-toolchain
      - name: Select release version
        id: version
        shell: bash
        run: |
          package_version=$(cargo metadata --locked --format-version 1 --no-deps | jq -r '.packages[] | select(.name == "daguard") | .version')
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v$package_version" ]]; then
            echo "tag $GITHUB_REF_NAME does not match Cargo package version $package_version" >&2
            exit 1
          fi
          echo "value=$package_version" >> "$GITHUB_OUTPUT"
      - name: Build optimized static binary
        env:
          DAGUARD_GIT_SHA: ${{ github.sha }}
          DAGUARD_PROVENANCE: github-actions
        shell: bash
        run: |
          echo "DAGUARD_RUSTC_VERSION=$(rustc --version)" >> "$GITHUB_ENV"
          echo "DAGUARD_CARGO_LOCK_SHA256=$(sha256sum Cargo.lock | awk '{print $1}')" >> "$GITHUB_ENV"
          DAGUARD_RUSTC_VERSION=$(rustc --version) \
          DAGUARD_CARGO_LOCK_SHA256=$(sha256sum Cargo.lock | awk '{print $1}') \
            cargo build --locked --release --target "$TARGET"
      - name: Verify binary target, metadata, and static linkage
        shell: bash
        run: |
          binary="target/$TARGET/release/daguard"
          file "$binary" | tee binary-file.txt
          file "$binary" | grep -E 'ELF 64-bit.*x86-64'
          if readelf -d "$binary" | grep -q NEEDED; then
            echo "release binary unexpectedly has dynamic dependencies" >&2
            exit 1
          fi
          if readelf -l "$binary" | grep -q 'Requesting program interpreter'; then
            echo "release binary unexpectedly has a dynamic interpreter" >&2
            exit 1
          fi
          "$binary" version | tee version.txt
          grep -F "($TARGET)" version.txt
          grep -F "git: $GITHUB_SHA" version.txt
          grep -F "Cargo.lock SHA-256: $DAGUARD_CARGO_LOCK_SHA256" version.txt
      - name: Measure release performance (informational timings)
        run: |
          cargo build --locked --release --target x86_64-unknown-linux-musl --example performance
          target/x86_64-unknown-linux-musl/release/examples/performance \
            --binary "target/$TARGET/release/daguard" \
            --samples 200 --iterations 10 > performance.json
      - name: Upload release performance report for review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-performance-${{ github.sha }}
          path: performance.json
      - name: Install pinned release inventory tools
        run: |
          cargo install cargo-cyclonedx --version 0.5.9 --locked
          cargo install cargo-deny --version 0.20.2 --locked
      - name: Generate SBOM and dependency/license inventories
        run: |
          cargo cyclonedx --format json --spec-version 1.5 --target "$TARGET" --all-features --override-filename daguard.cdx
          cargo metadata --locked --format-version 1 > dependency-inventory.json
          cargo deny list --format json > license-inventory.json
      - name: Assemble and test release bundle
        run: |
          SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)
          export SOURCE_DATE_EPOCH
          scripts/package-release.sh \
            --binary "target/$TARGET/release/daguard" \
            --output dist \
            --version "${{ steps.version.outputs.value }}" \
            --target "$TARGET" \
            --sbom daguard.cdx.json \
            --dependencies dependency-inventory.json \
            --licenses license-inventory.json
          tests/release_install.sh "dist/daguard-${{ steps.version.outputs.value }}-$TARGET"
      - name: Upload verified release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-${{ env.TARGET }}
          path: dist/*.tar.gz

  package-macos:
    needs: required
    name: Build and verify ${{ matrix.target }} release
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
            machine: arm64
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            machine: x86_64
    runs-on: ${{ matrix.runner }}
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Verify native runner and install pinned Rust target
        run: |
          test "$(uname -m)" = "${{ matrix.machine }}"
          rustup show active-toolchain
          rustup target add "$TARGET"
      - name: Select release version
        id: version
        run: |
          package_version=$(cargo metadata --locked --format-version 1 --no-deps | jq -r '.packages[] | select(.name == "daguard") | .version')
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v$package_version" ]]; then
            echo "tag $GITHUB_REF_NAME does not match Cargo package version $package_version" >&2
            exit 1
          fi
          echo "value=$package_version" >> "$GITHUB_OUTPUT"
      - name: Test and build native optimized binary
        env:
          DAGUARD_GIT_SHA: ${{ github.sha }}
          DAGUARD_PROVENANCE: github-actions
        run: |
          cargo test --locked --target "$TARGET"
          echo "DAGUARD_RUSTC_VERSION=$(rustc --version)" >> "$GITHUB_ENV"
          echo "DAGUARD_CARGO_LOCK_SHA256=$(shasum -a 256 Cargo.lock | awk '{print $1}')" >> "$GITHUB_ENV"
          DAGUARD_RUSTC_VERSION=$(rustc --version) \
          DAGUARD_CARGO_LOCK_SHA256=$(shasum -a 256 Cargo.lock | awk '{print $1}') \
            cargo build --locked --release --target "$TARGET"
      - name: Verify Mach-O target and embedded metadata
        run: |
          binary="target/$TARGET/release/daguard"
          file "$binary" | tee binary-file.txt
          file "$binary" | grep -F 'Mach-O 64-bit executable'
          file "$binary" | grep -F "${{ matrix.machine }}"
          "$binary" version | tee version.txt
          grep -F "($TARGET)" version.txt
          grep -F "git: $GITHUB_SHA" version.txt
          grep -F "Cargo.lock SHA-256: $DAGUARD_CARGO_LOCK_SHA256" version.txt
      - name: Install pinned release inventory tools
        run: |
          cargo install cargo-cyclonedx --version 0.5.9 --locked
          cargo install cargo-deny --version 0.20.2 --locked
      - name: Generate SBOM and dependency/license inventories
        run: |
          cargo cyclonedx --format json --spec-version 1.5 --target "$TARGET" --all-features --override-filename daguard.cdx
          cargo metadata --locked --format-version 1 > dependency-inventory.json
          cargo deny list --format json > license-inventory.json
      - name: Assemble and test native release bundle
        run: |
          SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)
          export SOURCE_DATE_EPOCH
          scripts/package-release.sh \
            --binary "target/$TARGET/release/daguard" \
            --output dist \
            --version "${{ steps.version.outputs.value }}" \
            --target "$TARGET" \
            --sbom daguard.cdx.json \
            --dependencies dependency-inventory.json \
            --licenses license-inventory.json
          tests/release_install.sh "dist/daguard-${{ steps.version.outputs.value }}-$TARGET"
      - name: Upload verified release artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-${{ matrix.target }}
          path: dist/*.tar.gz

  package-windows:
    needs: required
    name: Build and verify native Windows release
    runs-on: windows-latest
    env:
      TARGET: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install pinned Rust target
        shell: pwsh
        run: |
          rustup show active-toolchain
          rustup target add $env:TARGET
      - name: Select release version
        id: version
        shell: pwsh
        run: |
          $metadata = cargo metadata --locked --format-version 1 --no-deps | ConvertFrom-Json
          $packageVersion = ($metadata.packages | Where-Object name -eq 'daguard').version
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$packageVersion") {
            throw "tag $env:GITHUB_REF_NAME does not match Cargo package version $packageVersion"
          }
          "value=$packageVersion" >> $env:GITHUB_OUTPUT
      - name: Test and build static-CRT native binary
        shell: pwsh
        env:
          DAGUARD_GIT_SHA: ${{ github.sha }}
          DAGUARD_PROVENANCE: github-actions
        run: |
          cargo test --locked --target $env:TARGET
          $env:DAGUARD_RUSTC_VERSION = rustc --version
          $env:DAGUARD_CARGO_LOCK_SHA256 = (Get-FileHash Cargo.lock -Algorithm SHA256).Hash.ToLowerInvariant()
          cargo build --locked --release --target $env:TARGET
          $binary = "target\$env:TARGET\release\daguard.exe"
          $versionLines = @(& $binary version)
          $versionExitCode = $LASTEXITCODE
          $version = $versionLines -join "`n"
          if ($versionExitCode -ne 0 -or -not $version.Contains("($env:TARGET)") -or -not $version.Contains("git: $env:GITHUB_SHA") -or -not $version.Contains("Cargo.lock SHA-256: $env:DAGUARD_CARGO_LOCK_SHA256")) {
            Write-Host "Reported build metadata:`n$version"
            throw 'Native Windows build metadata verification failed.'
          }
      - name: Inspect PE runtime imports
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installation = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $dumpbin = Get-ChildItem "$installation\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          $imports = & $dumpbin.FullName /dependents "target\$env:TARGET\release\daguard.exe"
          $imports | Set-Content binary-dependencies.txt
          if ($imports -match '(?i)(vcruntime|msvcp|ucrtbase)\d*\.dll') {
            throw 'Native Windows binary unexpectedly imports a dynamic C/C++ runtime.'
          }
      - name: Install pinned release inventory tools
        shell: pwsh
        run: |
          cargo install cargo-cyclonedx --version 0.5.9 --locked
          cargo install cargo-deny --version 0.20.2 --locked
      - name: Generate inventories and assemble bundle
        shell: pwsh
        run: |
          cargo cyclonedx --format json --spec-version 1.5 --target $env:TARGET --all-features --override-filename daguard.cdx
          cargo metadata --locked --format-version 1 | Set-Content dependency-inventory.json -Encoding utf8NoBOM
          cargo deny list --format json | Set-Content license-inventory.json -Encoding utf8NoBOM
          scripts/package-windows.ps1 `
            -Binary "target\$env:TARGET\release\daguard.exe" `
            -Output dist `
            -Version "${{ steps.version.outputs.value }}" `
            -Sbom daguard.cdx.json `
            -Dependencies dependency-inventory.json `
            -Licenses license-inventory.json
          tests/windows_release.ps1 -Bundle "dist\daguard-${{ steps.version.outputs.value }}-$env:TARGET"
      - name: Upload verified release artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-${{ env.TARGET }}
          path: dist/*.zip

  publish:
    name: Publish primary WSL release
    needs: [required, package-linux]
    uses: ./.github/workflows/publish.yml
    permissions:
      attestations: write
      contents: write
      id-token: write
    with:
      artifact-pattern: release-x86_64-unknown-linux-musl
      checksum-name: SHA256SUMS
      create-release: true

  publish-macos:
    needs: [publish, package-macos]
    uses: ./.github/workflows/publish.yml
    permissions:
      attestations: write
      contents: write
      id-token: write
    with:
      artifact-pattern: release-*-apple-darwin
      checksum-name: SHA256SUMS-macos

  publish-windows:
    needs: [publish, package-windows]
    uses: ./.github/workflows/publish.yml
    permissions:
      attestations: write
      contents: write
      id-token: write
    with:
      artifact-pattern: release-x86_64-pc-windows-msvc
      checksum-name: SHA256SUMS-windows

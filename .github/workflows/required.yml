name: Required security checks

on:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: Formatting, linting, and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Verify tested source identity
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Verify lockfile is current
        run: cargo check --locked
      - name: Check formatting
        run: |
          cargo fmt --check
          cargo fmt --manifest-path fuzz/Cargo.toml --check
      - name: Lint
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Test
        run: |
          cargo test --locked
          cargo check --manifest-path fuzz/Cargo.toml --locked --all-targets
      - name: Test OpenCode bridge
        run: node --test integrations/opencode/daguard-plugin.test.js

  supply-chain:
    name: Dependency security and licenses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Verify tested source identity
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Install cargo-deny
        run: cargo install cargo-deny --version 0.20.2 --locked
      - name: Check dependency licenses and sources
        run: cargo deny --locked check advisories licenses sources bans
      - name: Check fuzz-only dependency vulnerabilities and licenses
        run: cargo deny --manifest-path fuzz/Cargo.toml --config fuzz/deny.toml --locked check advisories licenses sources bans
      - name: Write dependency license inventory
        run: cargo metadata --locked --format-version 1 > dependency-inventory.json
      - name: Upload dependency license inventory
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dependency-license-inventory
          path: dependency-inventory.json


name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: Formatting, linting, and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Verify lockfile is current
        run: cargo check --locked
      - name: Check formatting
        run: |
          cargo fmt --check
          cargo fmt --manifest-path fuzz/Cargo.toml --check
      - name: Lint
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --locked
      - name: Test OpenCode bridge
        run: node --test integrations/opencode/daguard-plugin.test.js

  macos:
    name: Native macOS smoke (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
            machine: arm64
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            machine: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify native runner and pinned toolchain
        run: |
          test "$(uname -m)" = "${{ matrix.machine }}"
          rustup show active-toolchain
          rustup target add "${{ matrix.target }}"
      - name: Run native Rust suite
        run: cargo test --locked --target "${{ matrix.target }}"
      - name: Build native optimized binary
        env:
          DAGUARD_GIT_SHA: ${{ github.sha }}
          DAGUARD_PROVENANCE: github-actions-macos-smoke
        run: |
          DAGUARD_RUSTC_VERSION=$(rustc --version) \
          DAGUARD_CARGO_LOCK_SHA256=$(shasum -a 256 Cargo.lock | awk '{print $1}') \
            cargo build --locked --release --target "${{ matrix.target }}"
          binary="target/${{ matrix.target }}/release/daguard"
          file "$binary" | grep -F 'Mach-O 64-bit executable'
          "$binary" version | grep -F '(${{ matrix.target }})'

  windows:
    name: Native Windows smoke
    runs-on: windows-latest
    env:
      TARGET: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust target
        shell: pwsh
        run: |
          rustup show active-toolchain
          rustup target add $env:TARGET
      - name: Run native Rust suite
        shell: pwsh
        run: cargo test --locked --target $env:TARGET
      - name: Build native optimized binary
        shell: pwsh
        env:
          DAGUARD_GIT_SHA: ${{ github.sha }}
          DAGUARD_PROVENANCE: github-actions-windows-smoke
        run: |
          $env:DAGUARD_RUSTC_VERSION = rustc --version
          $env:DAGUARD_CARGO_LOCK_SHA256 = (Get-FileHash Cargo.lock -Algorithm SHA256).Hash.ToLowerInvariant()
          cargo build --locked --release --target $env:TARGET
          $binary = "target\$env:TARGET\release\daguard.exe"
          if ((& $binary version) -notmatch "\($env:TARGET\)") {
            throw 'Native Windows target metadata verification failed.'
          }

  supply-chain:
    name: Dependency security and licenses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Scan dependency vulnerabilities
        run: cargo audit
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked
      - name: Check dependency licenses and sources
        run: cargo deny check licenses sources bans
      - name: Check fuzz-only dependency vulnerabilities and licenses
        run: cargo deny --manifest-path fuzz/Cargo.toml --config fuzz/deny.toml --locked check advisories licenses sources bans
      - name: Write dependency license inventory
        run: cargo metadata --locked --format-version 1 > dependency-inventory.json
      - name: Upload dependency license inventory
        uses: actions/upload-artifact@v4
        with:
          name: dependency-license-inventory
          path: dependency-inventory.json

  performance:
    name: Release performance report (informational timings)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain and target
        run: rustup show active-toolchain
      - name: Build optimized guard and benchmark harness
        env:
          DAGUARD_GIT_SHA: ${{ github.sha }}
          DAGUARD_PROVENANCE: github-actions-performance
        run: |
          cargo build --locked --release --target x86_64-unknown-linux-musl --bin daguard
          cargo build --locked --release --target x86_64-unknown-linux-musl --example performance
      - name: Measure and verify synthetic decisions
        run: |
          target/x86_64-unknown-linux-musl/release/examples/performance \
            --binary target/x86_64-unknown-linux-musl/release/daguard \
            --samples 200 --iterations 10 > performance.json
      - name: Upload performance report for review
        uses: actions/upload-artifact@v4
        with:
          name: performance-${{ github.sha }}
          path: performance.json

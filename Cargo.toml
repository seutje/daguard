[package]
name = "daguard"
version = "0.0.7"
edition = "2024"
rust-version = "1.99"
description = "Pre-execution policy guard for AI coding agents working on Drupal projects"
license = "MIT"
publish = false

[profile.release]
codegen-units = 1
lto = "thin"
panic = "unwind"
strip = "symbols"

[dependencies]
globset = "0.4.16"
libc = "=0.2.190"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.9"

[lints.rust]
warnings = "deny"

[lints.clippy]
all = "deny"
pedantic = "deny"

[[example]]
name = "performance"
test = true
